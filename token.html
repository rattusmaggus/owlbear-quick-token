<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 16px; background: #222639; color: #fff; }
      h2 { margin-top: 0; }
      .row { margin: 8px 0; font-size: 14px; }
      .label { opacity: 0.6; }
      button { margin-top: 16px; padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2 id="name">Loading...</h2>
    <div class="row"><span class="label">ID:</span> <span id="id"></span></div>
    <div class="row"><span class="label">Position:</span> <span id="pos"></span></div>
    <button id="close">Close</button>

    <script type="module">
      import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.0.0/+esm";

      const tokenId = new URLSearchParams(location.search).get("id");

      OBR.onReady(async () => {
        const [item] = await OBR.scene.items.getItems([tokenId]);
        if (!item) {
          document.getElementById("name").textContent = "Token not found";
        } else {
          document.getElementById("name").textContent = item.text?.plainText || item.name || "Unnamed token";
          document.getElementById("id").textContent = item.id;
          document.getElementById("pos").textContent =
            `${Math.round(item.position.x)}, ${Math.round(item.position.y)}`;
        }
        document.getElementById("close").onclick = () =>
          OBR.popover.close("com.yourname.token-viewer/popover");
      });
    </script>
  </body>
</html>
