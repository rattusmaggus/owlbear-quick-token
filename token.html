<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#222; --bg:#fff; --card:#f1f2f6; --accent:#6f5ee6; --sel:#6f5ee6; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#222639; --card:#2e3350; } }
  * { box-sizing:border-box; }
  body { font:14px system-ui,sans-serif; color:var(--fg); background:var(--bg); margin:0; padding:14px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:16px; margin:0; }
  .preview { align-self:center; width:240px; height:240px; background:
     conic-gradient(#8883 25%, transparent 0 50%, #8883 0 75%, transparent 0) 0 0/20px 20px; border-radius:8px; }
  canvas { width:100%; height:100%; display:block; }
  .borders { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-height:130px; overflow-y:auto; }
  .b { background:var(--card); border:2px solid transparent; border-radius:8px; padding:4px; cursor:pointer; text-align:center; font-size:11px; color:var(--fg); }
  .b img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  .b.sel { border-color:var(--sel); }
  input[type=text] { width:100%; padding:8px; border-radius:6px; border:1px solid #8886; background:var(--card); color:var(--fg); }
  .row { display:flex; gap:8px; }
  button { flex:1; padding:10px; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
  #save { background:var(--accent); color:#fff; }
  #cancel { background:var(--card); color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  #msg { min-height:18px; font-size:12px; opacity:.8; }
</style>
</head>
<body>
  <h1>Make Token <small style="font-weight:400;opacity:.5">v4</small></h1>
  <div class="preview"><canvas id="cv" width="512" height="512"></canvas></div>
  <div>Border</div>
  <div class="borders" id="borders"></div>
  <div>Size</div>
  <div class="borders" id="sizes"></div>
  <input type="text" id="name" placeholder="Token name">
  <div id="msg">Step 1 uploads the token to your Characters library. Step 2 swaps it onto the map.</div>
  <div class="row">
    <button id="cancel">Cancel</button>
    <button id="save" disabled>1. Upload to Library</button>
    <button id="swap" disabled>2. Swap on Map</button>
  </div>

<script type="module">
  import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.0.0/+esm";

  const SIZES = [
    { name: "Medium", cells: 1 },
    { name: "Large", cells: 2 },
    { name: "Huge", cells: 3 },
    { name: "Gargantuan", cells: 4 },
  ];
  let cells = 1;
  let OUT = 512; // pixel resolution, grows with token size
  const outFor = (c) => Math.max(512, 256 * c);
  const META = "com.quick-token/original";
  const $ = (id) => document.getElementById(id);
  const itemId = new URLSearchParams(location.search).get("item");
  let item, base, borderImg = null, borderIdx = -1; // -1 = no border

  const loadImg = (src) =>
    new Promise((res, rej) => {
      const i = new Image();
      i.crossOrigin = "anonymous";
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("could not load " + src));
      i.src = src;
    });

  // Square crop: horizontally centered, vertically aligned to the TOP.
  function draw() {
    const cv = $("cv"), ctx = cv.getContext("2d");
    OUT = outFor(cells);
    cv.width = cv.height = OUT;
    ctx.clearRect(0, 0, OUT, OUT);
    const side = Math.min(base.width, base.height);
    const sx = (base.width - side) / 2;
    const sy = 0;
    ctx.save();
    ctx.beginPath();
    ctx.arc(OUT / 2, OUT / 2, OUT / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(base, sx, sy, side, side, 0, 0, OUT, OUT);
    ctx.restore();
    if (borderImg) ctx.drawImage(borderImg, 0, 0, OUT, OUT);
  }

  async function init() {
    await new Promise((r) => OBR.onReady(r));
    const items = await OBR.scene.items.getItems([itemId]);
    item = items[0];
    if (!item) throw new Error("Item not found");
    $("name").value = (item.name || item.text?.plainText || "Token").trim();
    base = await loadImg(item.image.url);

    // Border picker (files listed in borders.json inside /borders)
    const wrap = $("borders");
    const add = (label, src, idx) => {
      const d = document.createElement("div");
      d.className = "b" + (idx === -1 ? " sel" : "");
      d.innerHTML = (src ? `<img src="${src}">` : `<img alt="">`) + label;
      d.onclick = async () => {
        wrap.querySelectorAll(".b").forEach((x) => x.classList.remove("sel"));
        d.classList.add("sel");
        borderIdx = idx;
        borderImg = src ? await loadImg(src) : null;
        draw();
      };
      wrap.appendChild(d);
    };
    add("None", null, -1);
    try {
      const list = (await (await fetch(new URL("borders.json", location.href))).json()).borders;
      list.forEach((b, i) => add(b.name, new URL("borders/" + b.file, location.href).href, i));
    } catch (e) { console.warn("no borders.json", e); }

    const sz = $("sizes");
    SIZES.forEach((z) => {
      const d = document.createElement("div");
      d.className = "b" + (z.cells === cells ? " sel" : "");
      d.innerHTML = `<b>${z.cells}×${z.cells}</b><br>${z.name}`;
      d.onclick = () => {
        sz.querySelectorAll(".b").forEach((x) => x.classList.remove("sel"));
        d.classList.add("sel");
        cells = z.cells;
        draw();
      };
      sz.appendChild(d);
    });

    draw();
    $("save").disabled = false;
  }

  $("cancel").onclick = () => OBR.modal.close("com.quick-token/modal");

  const errText = (e) =>
    (e && (e.message || (e.error && (e.error.message || e.error.name)))) ||
    (typeof e === "string" ? e : JSON.stringify(e)) || "unknown error";

  async function makeOutput() {
    const blob = await new Promise((r, j) =>
      $("cv").toBlob((b) => (b ? r(b) : j(new Error("could not export the canvas"))), "image/png"));
    const dataUrl = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error("could not read image data"));
      fr.readAsDataURL(blob);
    });
    const name = $("name").value.trim() || "Token";
    const side = Math.min(base.width, base.height);
    const dpi = OUT / cells; // image pixels per grid square -> token covers cells x cells
    return { blob, dataUrl, name, dpi };
  }

  async function uploadToLibrary({ blob, name, dpi }) {
    await OBR.assets.uploadImages(
      [{ file: new File([blob], name + ".png", { type: "image/png" }), name,
         grid: { dpi, offset: { x: OUT / 2, y: OUT / 2 } } }],
      "CHARACTER"
    );
  }

  async function setOriginalMeta() {
    await OBR.scene.items.updateItems([itemId], (items) => {
      for (const it of items) {
        if (!it.metadata[META]) {
          it.metadata[META] = {
            image: { url: it.image.url, width: it.image.width, height: it.image.height, mime: it.image.mime },
            grid: { dpi: it.grid.dpi, offset: { x: it.grid.offset.x, y: it.grid.offset.y } },
          };
        }
      }
    });
  }
  async function clearOriginalMeta() {
    try {
      await OBR.scene.items.updateItems([itemId], (items) => {
        for (const it of items) delete it.metadata[META];
      });
    } catch (_) {}
  }

  let uploadedName = "";

  // STEP 1: upload to the Characters library
  $("save").onclick = async () => {
    let step = "preparing image";
    try {
      $("save").disabled = true;
      const out = await makeOutput();
      uploadedName = out.name;

      step = "saving to library";
      $("msg").textContent = "Confirm Owlbear's upload dialog…";
      await uploadToLibrary(out);

      $("msg").textContent = "Uploaded. When the upload dialog has closed, click “2. Swap on Map”.";
      $("swap").disabled = false;
    } catch (e) {
      console.error("[Quick Token] failed while " + step, e);
      $("msg").textContent = `Failed while ${step}: ${errText(e)}`;
      $("save").disabled = false;
    }
  };

  // STEP 2: pick the uploaded token and swap it onto the map item
  $("swap").onclick = async () => {
    let step = "picking the saved token";
    try {
      $("swap").disabled = true;
      $("msg").textContent = "Select your new token in the picker and confirm.";
      const picked = await OBR.assets.downloadImages(false, uploadedName, "CHARACTER");
      if (!picked || !picked.length) throw new Error("nothing was selected");

      step = "swapping the image on the map";
      await setOriginalMeta();
      await OBR.scene.items.updateItems([itemId], (items) => {
        for (const it of items) {
          it.image = picked[0].image;
          it.grid = picked[0].grid;
          it.scale = { x: 1, y: 1 };
        }
      });
      OBR.notification.show("Token applied", "SUCCESS");
      OBR.modal.close("com.quick-token/modal");
    } catch (e) {
      console.error("[Quick Token] failed while " + step, e);
      if (step === "swapping the image on the map") await clearOriginalMeta();
      $("msg").textContent = `Failed while ${step}: ${errText(e)}`;
      $("swap").disabled = false;
    }
  };

  init().catch((e) => { $("msg").textContent = "Error: " + e.message; });
</script>
</body>
</html>
